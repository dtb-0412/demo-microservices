services:
  product-service:
    build: ./product-service
    ports:
      - "3001:3001"

  order-service:
    build: ./order-service
    ports:
      - "3002:3002"
    environment:
      PRODUCT_URL: http://product-service:3001

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PRODUCT_URL: http://product-service:3001
      ORDER_URL: http://order-service:3002